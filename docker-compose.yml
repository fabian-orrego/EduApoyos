name: eduapoyos

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: eduapoyos-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?La variable MSSQL_SA_PASSWORD es obligatoria. Copia .env.example a .env y define un valor.}
      MSSQL_PID: "Developer"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/EduApoyos.Api/Dockerfile
    container_name: eduapoyos-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DisableHttpsRedirection: "true"
      Swagger__Enabled: "true"
      Database__ApplyMigrationsOnStartup: "true"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=EduApoyos;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
      Jwt__Issuer: EduApoyos.Api
      Jwt__Audience: EduApoyos.Client
      Jwt__SecretKey: ${JWT_SECRET_KEY:?La variable JWT_SECRET_KEY es obligatoria. Copia .env.example a .env.}
      Jwt__AccessTokenExpirationMinutes: "60"
      Cors__AllowedOrigins__0: http://localhost:${WEB_PORT:-4200}
      Cors__AllowedOrigins__1: http://127.0.0.1:${WEB_PORT:-4200}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: eduapoyos-web
    ports:
      - "${WEB_PORT:-4200}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Use 127.0.0.1 (not localhost) so BusyBox wget hits IPv4; nginx listens on 0.0.0.0:80.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # Prints the public URLs once API + UI are healthy (same `docker compose up` command).
  banner:
    image: alpine:3.20
    container_name: eduapoyos-banner
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      API_PORT: ${API_PORT:-8080}
      WEB_PORT: ${WEB_PORT:-4200}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo ""
        echo "========================================================"
        echo "  EduApoyos listo"
        echo "  UI:      http://localhost:$${WEB_PORT}"
        echo "  Swagger: http://localhost:$${API_PORT}/swagger"
        echo "  API:     http://localhost:$${API_PORT}/api"
        echo "========================================================"
        echo ""
    restart: "no"

volumes:
  sqlserver-data:
    name: eduapoyos-sqlserver-data
