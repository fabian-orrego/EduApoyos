name: eduapoyos

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: eduapoyos-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?La variable MSSQL_SA_PASSWORD es obligatoria. Copia .env.example a .env y define un valor.}
      MSSQL_PID: "Developer"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  sqlserver-data:
    name: eduapoyos-sqlserver-data
