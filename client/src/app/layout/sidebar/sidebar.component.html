<nav class="app-sidebar">
  <mat-nav-list>
    @for (item of navItems(); track item.label + item.path) {
      <a
        mat-list-item
        [routerLink]="item.path"
        [class.active]="isActive(item)"
      >
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        <span matListItemTitle>{{ item.label }}</span>
      </a>
    }
  </mat-nav-list>
</nav>
